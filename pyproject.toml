[project]
name = "evrakci"
dynamic = ["version"]
description = "Yerel sifreli belge bulma araci (V1)"
requires-python = ">=3.12"
dependencies = [
  "sqlcipher3==0.6.4",
  "pypdfium2==5.14.0",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "python-docx==1.2.0",
  "defusedxml==0.7.1",
  "Pillow==13.0.0",
  "PySide6-Essentials==6.11.3",
  "rapidocr==3.10.0",
  "onnxruntime-directml==1.24.4",
  "opencv-python-headless==4.11.0.86",
  "numpy==2.5.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "reportlab==5.1.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "evrakci.version.__version__"}

[tool.setuptools.package-data]
evrakci = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
